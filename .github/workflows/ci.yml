name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-27:
    runs-on: macos-26
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Detect Xcode 27
        id: detect
        shell: bash
        run: |
          if find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub's macos-26 image does not yet include Xcode 27."
          fi

  build-and-test:
    needs: xcode-27
    if: needs.xcode-27.outputs.available == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        shell: bash
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | sort | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Build all targets
        run: swift build --build-tests
      - name: Run tests
        run: swift test

  hosted-runner-notice:
    needs: xcode-27
    if: needs.xcode-27.outputs.available != 'true'
    runs-on: macos-26
    steps:
      - name: Report unavailable toolchain
        run: |
          echo "### Xcode 27 CI is waiting on the GitHub-hosted runner image." >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow will enable the build and test job automatically when Xcode 27 appears under /Applications." >> "$GITHUB_STEP_SUMMARY"
